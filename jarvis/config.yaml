ollama:
  host: http://localhost:11434
  model: qwen3:4b-instruct-2507-q4_K_M  # variante sans raisonnement : réponses directes
  keep_alive: 5m
whisper:
  model: models/whisper-small  # téléchargé par setup.ps1
  device: cuda
  compute_type: int8_float16
  idle_unload_s: 300
wake:
  model: hey_jarvis
  threshold: 0.1   # mesuré : « Hey Jarvis » 0,12 à 0,72 avec l'accent français, phrase normale 0,00
listen:
  silence_rms: 150   # mesuré avec --micro (micro Windows à 100 %) : bruit 2-5, voix ~4700
  silence_s: 1.0
  start_timeout_s: 5
  max_s: 15
voice:
  model: voices/fr_FR-tom-medium.onnx
claude:
  projects_dir: ~/projets
memory:
  path: data/memoire.db
hud:
  ecran: -1             # écran du HUD : 0 = principal, -1 = dernier branché (le 20" une fois connecté)
  masquer_apres_s: 90   # masque le HUD après ce délai sans activité (0 = jamais)
  layout: data/hud_layout.json
  meteo:                # à adapter à votre ville
    ville: Paris
    latitude: 48.8566
    longitude: 2.3522
  agenda_ics: ""        # chemin ou URL d'un calendrier .ics (Google, iCloud, Outlook : « adresse secrète iCal »)
