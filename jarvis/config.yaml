ollama:
  host: http://localhost:11434
  model: qwen3:4b-instruct-2507-q4_K_M  # variante sans raisonnement : réponses directes
  keep_alive: 5m
  num_ctx: 3072         # contexte réduit : moins de mémoire, génération plus rapide
  historique: 12        # messages gardés d'un échange à l'autre
whisper:
  model: models/whisper-small  # téléchargé par setup.ps1
  device: cuda
  compute_type: int8_float16
  idle_unload_s: 300
wake:
  model: hey_jarvis
  threshold: 0.1   # mesuré : « Hey Jarvis » 0,12 à 0,72 avec l'accent français, phrase normale 0,00
  verifier: data/reveil_verificateur.pkl   # créé par --entrainer-reveil ; s'il existe, il remplace le seuil ci-dessus
  verifier_base: 0.05   # score minimal du modèle de base pour consulter le vérificateur
  verifier_threshold: 0.5   # réveil si le vérificateur reconnaît votre voix au-delà de ce score
listen:
  silence_rms: 150   # mesuré avec --micro (micro Windows à 100 %) : bruit 2-5, voix ~4700
  silence_s: 1.0
  start_timeout_s: 5
  max_s: 15
voice:
  edge: fr-FR-RemyMultilingualNeural   # voix Microsoft (en ligne) ; vide = voix locale Piper seule
  vitesse: "+0%"
  paralleles: 3         # requêtes simultanées par phrase (le réseau en coupe une sur deux)
  delai_max_s: 4        # au-delà, la phrase est dite par la voix locale
  cache: data/voix_cache
  model: voices/fr_FR-tom-medium.onnx   # voix locale de secours (chargée seulement si besoin)
claude:
  projects_dirs: [~/Documents, ~/Desktop]   # dossiers où chercher « le projet X »
  permission_mode: auto   # Claude agit seul sur ce qui est sûr (tests, lecture), refuse le reste
  timeout_s: 900
memory:
  path: data/memoire.db
hud:
  ecran: -1             # écran du HUD : 0 = principal, -1 = dernier branché (le 20" une fois connecté)
  masquer_apres_s: 90   # masque le HUD après ce délai sans activité (0 = jamais)
  layout: data/hud_layout.json
  meteo:                # à adapter à votre ville
    ville: Nailloux
    latitude: 43.35611
    longitude: 1.62292
  agenda_ics: ""        # chemin ou URL d'un calendrier .ics (Google, iCloud, Outlook : « adresse secrète iCal »)
