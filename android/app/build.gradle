plugins { id 'com.android.application' }
def ks = new Properties(); def ksf = rootProject.file('keystore.properties'); if (ksf.exists()) ks.load(new FileInputStream(ksf))
android {
  namespace 'fr.theoanziani.idlebusiness'
  compileSdk 35
  defaultConfig { applicationId 'fr.theoanziani.idlebusiness'; minSdk 24; targetSdk 35; versionCode 269; versionName '2.6.9' }
  signingConfigs { release { if (ks) { storeFile file(ks['storeFile']); storePassword ks['storePassword']; keyAlias ks['keyAlias']; keyPassword ks['keyPassword'] } } }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
/* copie le site construit dans les ressources de l'appli */
tasks.register('copySite', Copy) {
  from('../../../idle-business') { include 'index.html','sw.js','manifest.webmanifest','fonts/**','img/**','icons/**' }
  into 'src/main/assets/www'
}
preBuild.dependsOn copySite
